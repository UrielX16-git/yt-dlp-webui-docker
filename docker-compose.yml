services:
  # Servicio Valkey (cola)
  valkey:
    image: valkey/valkey:7-alpine
    container_name: yt-dlp-valkey
    restart: unless-stopped
    volumes:
      - ./data/valkey:/data
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - yt-dlp-network

  # API principal
  api:
    build: .
    container_name: yt-dlp-api
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "8001:80"
    environment:
      - PYTHONUNBUFFERED=1
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - yt-dlp-network

  # Worker para procesamiento de descargas
  worker:
    build: .
    container_name: yt-dlp-worker
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
    command: python -m app.services.worker_svc
    networks:
      - yt-dlp-network

  # Frontend Web (Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: yt-dlp-frontend
    depends_on:
      - api
    ports:
      - "5000:80"
    restart: unless-stopped
    networks:
      - yt-dlp-network

networks:
  yt-dlp-network:
    name: multimedia-net
    external: true
